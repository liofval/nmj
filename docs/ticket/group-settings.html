<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>団体の設定｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="org.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body class="org-page">
<div data-header="org" data-active="settings"></div>
<main id="main"></main>
<script>
NMT.ready(function (db, ui) {
  var esc = ui.esc, f = NMT.fmt, main = document.getElementById('main');
  if (!ui.requireLogin()) return;
  var me = db.currentUser();
  var org = NMT.currentOrg();

  function gate(title, body, actions) {
    main.innerHTML = '<div class="wrap org-gate"><div class="box stack"><h1 class="org-gate__title">' + esc(title) + '</h1><p class="t-small">' + esc(body) + '</p><div class="cluster">' + (actions || '') + '</div></div></div>';
  }
  if (!org) return gate('管理している団体がありません', '団体を作ると、ここで団体の情報とメンバーを管理できます。', '<a class="btn btn--black" href="' + ui.url('groupNew') + '">団体を作る</a>');
  if (org.type !== 'GROUP') return gate('個人の設定はプロフィールで変えます', 'あだ名・ユーザーネーム・紹介文はプロフィール編集から変えられます。', '<a class="org-btn org-btn--black" href="' + ui.url('profile') + '">プロフィール編集へ</a>');
  if (!db.isOwner(org.id)) return gate('このページを見る権限がありません', org.displayName + ' の設定は、団体の owner だけが変えられます。', '<a class="org-btn" href="' + ui.url('organizer', { slug: org.slug }) + '">公開ページを見る</a>');

  var TABS = [['profile', 'プロフィール'], ['members', 'メンバー'], ['payout', '入金先']];
  var tab = (location.hash || '').slice(1);
  if (!TABS.some(function (t) { return t[0] === tab; })) tab = 'profile';

  function inviteUrl(inv) {
    return new URL(ui.url('login', { invite: inv.token, next: ui.url('dashboard', { org: org.slug }) }), location.href).href;
  }

  function profileTab() {
    return '<form class="box stack gs-form" id="gs-profile" novalidate style="--stack-gap:24px">' +
      '<label class="field"><span class="field__label">団体名 <span class="req">必須</span></span><input class="input" name="displayName" maxlength="40" value="' + esc(org.displayName) + '"></label>' +
      '<label class="field"><span class="field__label">ユーザーネーム <span class="req">必須</span></span>' +
        '<span class="gn-slug"><span class="gn-slug__at" aria-hidden="true">@</span><input class="input" name="slug" maxlength="30" value="' + esc(org.slug) + '" autocapitalize="off" spellcheck="false"></span>' +
        '<span class="field__help">変えると公開ページの URL も変わります</span></label>' +
      '<label class="field"><span class="field__label">紹介文</span><textarea class="textarea" name="bio" maxlength="400">' + esc(org.bio || '') + '</textarea></label>' +
      '<p class="field__error" hidden data-err></p>' +
      '<div class="cluster"><button class="btn btn--black" type="submit">保存する<img class="icon" src="assets/icon-arrow-btn-white.svg" alt=""></button>' +
        '<a class="org-btn" href="' + ui.url('organizer', { slug: org.slug }) + '">公開ページを見る</a></div>' +
    '</form>' +
    '<section class="box stack gs-danger" style="--stack-gap:12px"><h2 class="box__title" style="margin:0">団体の削除</h2>' +
      '<p class="t-small">削除は NMJ 運営に依頼します（イベント・フォロワー・申込の扱いは検討中）。</p>' +
      '<div><a class="org-btn" href="mailto:info@example.com?subject=' + encodeURIComponent('団体の削除の依頼：@' + org.slug) + '">運営に依頼</a></div></section>';
  }

  function membersTab() {
    var members = db.membersOf(org.id);
    var owners = members.filter(function (m) { return m.role === 'OWNER'; });
    var lastOwner = owners.length <= 1;
    var invites = db.t.invitations.filter(function (i) { return i.organizerId === org.id && !i.revokedAt && !i.acceptedAt && Date.parse(i.expiresAt) > db.now(); })
      .sort(function (a, b) { return Date.parse(b.createdAt) - Date.parse(a.createdAt); });
    var requests = db.t.joinRequests.filter(function (r) { return r.organizerId === org.id && r.status === 'PENDING'; });

    return '<section class="box stack" style="--stack-gap:16px">' +
        '<div class="gs-row-head"><h2 class="box__title" style="margin:0">運営メンバー <span class="t-muted">' + members.length + ' 人</span></h2>' +
          '<button class="org-btn org-btn--black" type="button" data-invite>＋ 招待する</button></div>' +
        '<div class="table-scroll"><table class="table"><thead><tr><th>メンバー</th><th>権限</th><th>参加</th><th>操作</th></tr></thead><tbody>' +
        members.map(function (m) {
          var p = db.profileOf(m.userId), self = m.userId === me.id;
          return '<tr><td><strong>' + esc(p ? p.displayName : '') + '</strong>' + (self ? '（あなた）' : '') + ' <span class="t-muted t-small">@' + esc(p ? p.slug : '') + '</span></td>' +
            '<td>' + esc(m.role.toLowerCase()) + '</td><td>' + (m.joinedAt ? f.ymd(m.joinedAt) : '招待中') + '</td>' +
            '<td>' + (self ? (lastOwner ? '<span class="t-small t-muted">離脱できません</span>' : '<button class="org-btn" type="button" data-leave>団体から抜ける</button>') : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (lastOwner ? '<p class="notice t-small">owner が1人だけのときは離脱できません。代替わりの場合は、先に次の代表を owner として招待してください。</p>' : '') +
      '</section>' +
      '<section class="box stack" style="--stack-gap:12px"><h2 class="box__title" style="margin:0">参加の依頼 <span class="t-muted">' + requests.length + ' 件</span></h2>' +
        (requests.length ? requests.map(function (r) {
          var p = db.profileOf(r.userId);
          return '<div class="gs-item"><div class="gs-item__text"><p><strong>' + esc(p ? p.displayName : '') + '</strong> <span class="t-muted t-small">@' + esc(p ? p.slug : '') + ' · ' + f.ago(r.createdAt, db.now()) + '</span></p>' +
            (r.message ? '<p class="t-small">' + esc(r.message) + '</p>' : '') + '</div>' +
            '<div class="cluster" style="--cluster-gap:8px"><button class="org-btn" type="button" data-decide="' + esc(r.id) + '" data-approve="0">却下</button><button class="org-btn org-btn--black" type="button" data-decide="' + esc(r.id) + '" data-approve="1">承認して owner にする</button></div></div>';
        }).join('') : '<p class="t-small t-muted">届いている依頼はありません。団体の作成画面で似た名前の団体を見つけた人から届きます。</p>') +
      '</section>' +
      '<section class="box stack" style="--stack-gap:12px"><h2 class="box__title" style="margin:0">招待中のリンク</h2>' +
        (invites.length ? invites.map(function (i) {
          return '<div class="gs-item"><div class="gs-item__text"><p class="t-small">招待リンク（owner）· 有効期限 ' + f.md(i.expiresAt) + ' まで</p><p class="gs-link t-small t-muted">' + esc(inviteUrl(i)) + '</p></div>' +
            '<button class="org-btn" type="button" data-copy="' + esc(i.id) + '">リンクをコピー</button></div>';
        }).join('') : '<p class="t-small t-muted">招待中のリンクはありません。</p>') +
      '</section>';
  }

  function payoutTab() {
    return '<section class="box stack" style="--stack-gap:12px"><h2 class="box__title" style="margin:0">入金先 <span class="pill pill--line">後日</span></h2>' +
      '<p class="t-small">実決済を始めるときに設定できるようになります（現在はモック決済）。</p></section>';
  }

  function render() {
    main.innerHTML = '<div class="wrap">' +
      '<div class="p-head"><div><p class="p-head__en">SETTINGS</p><h1 class="p-head__ja">団体の設定 <span class="t-muted">' + esc(org.displayName) + '</span></h1></div>' +
        '<a class="org-btn" href="' + ui.url('dashboard', { org: org.slug }) + '">ダッシュボードへ</a></div>' +
      '<div class="tabs gs-tabs" role="tablist">' + TABS.map(function (t) {
        return '<button class="tabs__item" type="button" role="tab" id="tab-' + t[0] + '" aria-controls="panel" aria-selected="' + (t[0] === tab) + '" data-tab="' + t[0] + '">' + t[1] + (t[0] === 'payout' ? ' <span class="t-small t-muted">後日</span>' : '') + '</button>';
      }).join('') + '</div>' +
      '<div class="gs-panel stack" id="panel" role="tabpanel" aria-labelledby="tab-' + tab + '" style="--stack-gap:24px">' +
        (tab === 'members' ? membersTab() : tab === 'payout' ? payoutTab() : profileTab()) +
      '</div></div>';
  }

  main.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab],[data-invite],[data-copy],[data-decide],[data-leave]');
    if (!t) return;
    if (t.hasAttribute('data-tab')) { tab = t.getAttribute('data-tab'); history.replaceState(null, '', '#' + tab); render(); return; }
    if (t.hasAttribute('data-invite')) {
      ui.modal({
        title: 'メンバーを招待',
        html: '<div class="stack"><p class="t-small">招待リンクを LINE などで共有します。受け取った人は Google ログイン後に参加できます。</p>' +
          '<dl class="gs-dl t-small"><dt>権限</dt><dd>owner（イベントの作成・編集・参加者の閲覧・メンバー招待）</dd><dt>有効期限</dt><dd>7日</dd></dl>' +
          '<p class="t-small t-muted">owner は複数人にできます</p></div>',
        actions: [{ label: 'やめる', value: false, kind: 'outline' }, { label: '招待リンクを発行', value: true, kind: 'black' }]
      }).then(function (v) {
        if (!v) return;
        try { var inv = db.createInvitation(org.id); } catch (x) { return ui.toast(x.message); }
        render();
        var link = inviteUrl(inv);
        ui.modal({
          title: '招待リンクを発行しました',
          html: '<div class="stack"><p class="t-small">有効期限は ' + f.md(inv.expiresAt) + ' までです。</p><input class="input" readonly value="' + esc(link) + '" aria-label="招待リンク"></div>',
          actions: [{ label: '閉じる', value: false, kind: 'outline' }, { label: 'リンクをコピー', kind: 'black', onClick: function () { ui.copyLink(link); } }]
        });
      });
      return;
    }
    if (t.hasAttribute('data-copy')) {
      var inv = db.t.invitations.find(function (i) { return i.id === t.getAttribute('data-copy'); });
      if (inv) ui.copyLink(inviteUrl(inv));
      return;
    }
    if (t.hasAttribute('data-decide')) {
      var approve = t.getAttribute('data-approve') === '1';
      try { db.decideJoin(t.getAttribute('data-decide'), approve); } catch (x) { return ui.toast(x.message); }
      ui.toast(approve ? '承認しました。owner に加わりました' : '却下しました');
      render();
      return;
    }
    if (t.hasAttribute('data-leave')) {
      ui.confirm({ title: org.displayName + ' から抜けますか？', body: 'この団体のダッシュボード・イベントの管理ができなくなります。戻るには owner にもう一度招待してもらう必要があります。', ok: '抜ける', danger: true }).then(function (yes) {
        if (!yes) return;
        try { db.leaveGroup(org.id); } catch (x) { return ui.toast(x.message); }
        location.href = ui.url('mypage');
      });
    }
  });

  main.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'gs-profile') return;
    ev.preventDefault();
    var fm = ev.target, err = fm.querySelector('[data-err]');
    var name = fm.elements.displayName.value.trim(), slug = fm.elements.slug.value.trim();
    err.hidden = true;
    if (!name) { err.textContent = '団体名を入力してください'; err.hidden = false; return; }
    try { db.updateGroup(org.id, { displayName: name, slug: slug, bio: fm.elements.bio.value.trim() }); }
    catch (x) { err.textContent = x.message; err.hidden = false; return; }
    try { sessionStorage.setItem('nmt:gs-flash', '団体の情報を保存しました'); } catch (x) { /* 保存できなくても続ける */ }
    if (slug !== ui.param('org')) { location.replace(ui.url('groupSettings', { org: slug }) + '#profile'); return; }
    location.reload();
  });

  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    if (TABS.some(function (t) { return t[0] === h; }) && h !== tab) { tab = h; render(); }
  });
  render();
  try { var flash = sessionStorage.getItem('nmt:gs-flash'); if (flash) { sessionStorage.removeItem('nmt:gs-flash'); ui.toast(flash); } } catch (x) { /* なくてよい */ }
});
</script>
</body>
</html>
