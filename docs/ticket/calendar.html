<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベント（カレンダー）｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="events.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body>

<div data-header="v2" data-active="events"></div>

<main>
  <!-- PageHead -->
  <div class="wrap page-head page-head--cal">
    <div class="page-head__titles">
      <h1 class="page-head__en">EVENTS</h1>
      <div class="page-head__sub">
        <p class="page-head__ja">イベントをさがす</p>
        <p class="page-head__count" data-month-count></p>
      </div>
    </div>
    <nav class="view-toggle view-toggle--cal" aria-label="表示切替">
      <a class="view-toggle__item" href="events-list.html" data-view="eventsList">リスト</a>
      <a class="view-toggle__item" href="events.html" data-view="events">カード</a>
      <a class="view-toggle__item is-active" href="calendar.html" aria-current="page">カレンダー</a>
    </nav>
  </div>

  <!-- ジャンル絞り込み＋凡例 -->
  <div class="wrap filter-row filter-row--cal">
    <div class="chip-row" role="group" aria-label="ジャンル" data-genre-chips></div>
    <ul class="cal-legend" aria-label="色の凡例">
      <li class="cal-legend__item"><span class="cal-legend__swatch g-music"></span>音楽</li>
      <li class="cal-legend__item"><span class="cal-legend__swatch g-sports"></span>スポーツ</li>
      <li class="cal-legend__item"><span class="cal-legend__swatch g-study"></span>学び</li>
      <li class="cal-legend__item"><span class="cal-legend__swatch g-party"></span>交流会</li>
      <li class="cal-legend__item"><span class="cal-legend__swatch g-other"></span>その他</li>
    </ul>
  </div>

  <div class="wrap cal-layout">
    <!-- Month -->
    <section class="cal-month" data-month>
      <div class="cal-month__head">
        <h2 class="cal-month__title"><span class="cal-month__en" data-month-en></span><span class="cal-month__ja" data-month-ja></span></h2>
        <div class="cal-month__nav">
          <button class="cal-navbtn" type="button" aria-label="前の月" data-nav="-1">←</button>
          <button class="cal-navbtn" type="button" data-nav="0">今月</button>
          <button class="cal-navbtn" type="button" aria-label="次の月" data-nav="1">→</button>
        </div>
      </div>
      <div class="cal-grid" data-grid></div>
    </section>

    <!-- DayPanel -->
    <section class="day-panel" data-panel aria-live="polite"></section>
  </div>
</main>

<div data-footer></div>

<script>
// ヘッダー差し込み（DOMContentLoaded）の後に描く
document.addEventListener('DOMContentLoaded', function () {
NMT.ready(function (db, ui) {
  var f = NMT.fmt, DAY = 864e5, H9 = 9 * 3600e3;
  var EN = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var WD = ['月', '火', '水', '木', '金', '土', '日'];
  var TAG = { music: 'g-music', sports: 'g-sports', study: 'g-study', party: 'g-party' }; // それ以外のジャンルは「その他」
  var genres = db.t.genres.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; });
  var SHORT = { music: '音楽', sports: 'スポーツ', study: '学び', party: '交流会', art: 'アート', career: 'キャリア' };

  function ymdOf(ms) { return new Date(ms + H9).toISOString().slice(0, 10); }
  function dayStart(ymd) { return Date.parse(ymd + 'T00:00:00+09:00'); }
  function pad(n) { return ('0' + n).slice(-2); }
  var today = ymdOf(db.now());

  // ---- URL ⇔ 条件（一覧と共通の条件 ＋ ?ym= ?day=） ----
  var KEEP = ['q', 'area', 'genre', 'kind', 'free', 'avail'];
  function readState() {
    var p = new URLSearchParams(location.search), s = {};
    KEEP.concat(['ym', 'day']).forEach(function (k) { var v = (p.get(k) || '').trim(); if (v) s[k] = v; });
    if (s.genre && !genres.some(function (g) { return g.slug === s.genre; })) delete s.genre;
    if (s.area && NMT.AREAS.indexOf(s.area) < 0) delete s.area;
    if (s.kind && !NMT.LABEL.SlotKind[s.kind]) delete s.kind;
    if (s.free !== '1') delete s.free;
    if (s.avail !== '1') delete s.avail;
    if (s.day && !(/^\d{4}-\d{2}-\d{2}$/.test(s.day) && !isNaN(dayStart(s.day)))) delete s.day;
    if (s.ym && !/^\d{4}-(0[1-9]|1[0-2])$/.test(s.ym)) delete s.ym;
    if (!s.ym) s.ym = (s.day || today).slice(0, 7);
    if (!s.day || s.day.slice(0, 7) !== s.ym) s.day = s.ym === today.slice(0, 7) ? today : s.ym + '-01';
    return s;
  }
  var state = readState();
  function writeUrl() { history.replaceState(null, '', ui.url('calendar', state)); }
  function listParams(extra) {
    var p = {}; KEEP.forEach(function (k) { if (state[k]) p[k] = state[k]; });
    return Object.assign(p, extra || {});
  }

  // その月に重なる公開イベント（終わったものも出す）。日ごとに「開催中の日」に並べる
  function monthEvents(y, m) {
    var from = Date.UTC(y, m - 1, 1) - H9, to = Date.UTC(y, m, 1) - H9 - 1;
    var list = db.searchEvents({ q: state.q, genre: state.genre, area: state.area, kind: state.kind, free: state.free === '1',
      from: new Date(from).toISOString(), to: new Date(to).toISOString(), status: 'all' });
    if (state.avail) list = list.filter(function (e) { return db.eventBadge(e.id).kind !== 'soldout'; });
    return list;
  }
  function onDay(list, ymd) {
    var a = dayStart(ymd), b = a + DAY - 1;
    return list.filter(function (e) { return Date.parse(e.startAt) <= b && Date.parse(e.endAt) >= a; });
  }
  function tagClass(e) { var g = db.genreById(e.genreId); return (g && TAG[g.slug]) || 'g-other'; }

  // ---- ジャンルのチップ ----
  var chips = document.querySelector('[data-genre-chips]');
  function renderChips() {
    chips.innerHTML = [['', 'すべて']].concat(genres.map(function (g) { return [g.slug, SHORT[g.slug] || g.name]; })).map(function (c) {
      var on = (state.genre || '') === c[0];
      return '<button class="chip' + (on ? ' is-active' : '') + '" type="button" aria-pressed="' + on + '" data-genre="' + ui.esc(c[0]) + '">' + ui.esc(c[1]) + '</button>';
    }).join('');
  }
  chips.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-genre]'); if (!b) return;
    var g = b.getAttribute('data-genre');
    if (g) state.genre = g; else delete state.genre;
    writeUrl(); render();
  });

  // ---- 月 ----
  function render() {
    renderChips();
    var y = +state.ym.slice(0, 4), m = +state.ym.slice(5, 7);
    var list = monthEvents(y, m);
    var cond = [state.q ? '「' + state.q + '」' : '', state.area ? (state.area === 'online' ? 'オンライン' : state.area) : '',
      state.kind ? NMT.LABEL.SlotKind[state.kind] + 'の枠あり' : '', state.free ? '無料' : '', state.avail ? '売り切れを除く' : ''].filter(Boolean);
    document.querySelector('[data-month-count]').textContent = m + '月の開催 ' + list.length + '件' + (cond.length ? '（' + cond.join('・') + '）' : '');
    document.querySelector('[data-month]').setAttribute('aria-label', y + '年' + m + '月のカレンダー');
    document.querySelector('[data-month-en]').textContent = EN[m - 1] + ' ' + y;
    document.querySelector('[data-month-ja]').textContent = y + '年' + m + '月';

    var first = Date.UTC(y, m - 1, 1), lead = (new Date(first).getUTCDay() + 6) % 7; // 月曜はじまり
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var cells = Math.ceil((lead + days) / 7) * 7;
    var html = WD.map(function (w) { return '<div class="cal-grid__wd">' + w + '</div>'; }).join('');
    for (var i = 0; i < cells; i++) {
      var d = new Date(first + (i - lead) * DAY), ymd = d.toISOString().slice(0, 10), out = ymd.slice(0, 7) !== state.ym;
      var isToday = ymd === today ? '<span class="cal-today">今日</span>' : '';
      if (out) { html += '<div class="cal-day cal-day--out"><span class="cal-day__num">' + d.getUTCDate() + isToday + '</span></div>'; continue; }
      var evs = onDay(list, ymd), sel = ymd === state.day;
      var label = (m) + '月' + d.getUTCDate() + '日（' + WD[(d.getUTCDay() + 6) % 7] + '）' + (evs.length ? ' ' + evs.length + '件' : '');
      html += '<div class="cal-day' + (sel ? ' is-selected' : '') + '" data-day="' + ymd + '"' + (sel ? ' aria-current="date"' : '') + '>' +
        '<button class="cal-day__num" type="button" data-pick="' + ymd + '" aria-label="' + ui.esc(label) + '" aria-pressed="' + sel + '">' + d.getUTCDate() + isToday + '</button>' +
        evs.slice(0, 2).map(function (e) { return '<a class="cal-tag ' + tagClass(e) + '" href="' + ui.url('event', { id: e.id }) + '" title="' + ui.esc(e.title) + '">' + ui.esc(e.title) + '</a>'; }).join('') +
        (evs.length > 2 ? '<button class="cal-more" type="button" data-pick="' + ymd + '">+' + (evs.length - 2) + '件</button>' : '') +
      '</div>';
    }
    document.querySelector('[data-grid]').innerHTML = html;
    renderPanel(list);
    document.querySelector('[data-view=events]').href = ui.url('events', listParams());
    document.querySelector('[data-view=eventsList]').href = ui.url('eventsList', listParams());
  }

  // ---- その日のイベント ----
  function renderPanel(list) {
    var evs = onDay(list, state.day), ds = dayStart(state.day);
    var html = '<div class="day-panel__head"><span class="day-panel__date">' + f.ymd(ds).slice(5) + '</span><span class="day-panel__label">（' + f.wd(ds) + '）のイベント ' + evs.length + '件</span></div>';
    html += evs.map(function (e) {
      var price = f.priceLabel(db.priceRange(e.id));
      var started = ymdOf(Date.parse(e.startAt)) !== state.day;
      return '<a class="day-item" href="' + ui.url('event', { id: e.id }) + '">' +
        '<img class="day-item__thumb" src="' + ui.esc(e.coverUrl) + '" alt="" loading="lazy">' +
        '<div class="day-item__body">' +
          '<span class="day-item__time">' + (started ? f.md(e.startAt) + ' ' : '') + f.hm(e.startAt) + '</span>' +
          '<h3 class="day-item__title">' + ui.esc(e.title) + '</h3>' +
          '<p class="day-item__venue">' + ui.esc(e.venueName || 'オンライン') + '</p>' +
          '<div class="day-item__bottom"><span class="price' + (price === '無料' ? ' price--free' : '') + '">' + price + '</span>' + ui.pill(db.eventBadge(e.id)) + '</div>' +
        '</div></a>';
    }).join('');
    if (!evs.length) html += '<p class="day-panel__empty">この日のイベントはありません。色のついた日を選んでください。</p>';
    else html += '<div class="day-panel__link"><a class="link-arrow" href="' + ui.url('eventsList', listParams({ date: state.day })) + '">この日のイベントを一覧で見る<img class="icon" src="assets/icon-arrow-up-right.svg" alt=""></a></div>';
    html += '<p class="day-panel__hint">ヒント：カレンダーの色はジャンル。日付を選ぶと、その日のイベントがここに出ます。絞り込みは一覧と共通です。</p>';
    var panel = document.querySelector('[data-panel]');
    panel.setAttribute('aria-label', f.md(ds) + 'のイベント');
    panel.innerHTML = html;
  }

  // ---- 操作 ----
  document.querySelector('[data-grid]').addEventListener('click', function (ev) {
    if (ev.target.closest('a')) return;
    var b = ev.target.closest('[data-pick]') || ev.target.closest('[data-day]');
    if (!b) return;
    state.day = b.getAttribute('data-pick') || b.getAttribute('data-day');
    writeUrl(); render();
    if (matchMedia('(max-width: 1023px)').matches) document.querySelector('[data-panel]').scrollIntoView({ behavior: 'smooth', block: 'start' });
    else { var nb = document.querySelector('[data-pick="' + state.day + '"]'); if (nb) nb.focus(); }
  });
  document.querySelector('.cal-month__nav').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-nav]'); if (!b) return;
    var step = +b.getAttribute('data-nav');
    if (step === 0) { state.ym = today.slice(0, 7); state.day = today; }
    else {
      var y = +state.ym.slice(0, 4), m = +state.ym.slice(5, 7) + step;
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      state.ym = y + '-' + pad(m);
      state.day = state.ym === today.slice(0, 7) ? today : state.ym + '-01';
    }
    writeUrl(); render();
  });

  writeUrl(); render();
});
});
</script>
</body>
</html>
