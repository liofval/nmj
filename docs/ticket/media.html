<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メディア｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="media.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body>

<div data-header="v2" data-active="media"></div>

<main>
  <!-- 見出し -->
  <div class="wrap m-head">
    <h1 class="m-head__en">MEDIA</h1>
    <div class="m-head__ja">
      <p class="m-head__title">読みもの</p>
      <p class="m-head__lead">学生イベントの“いま”と、行く前に知りたいこと。</p>
    </div>
  </div>

  <!-- カテゴリ絞り込み（?cat=） -->
  <div class="wrap chip-row m-filter" role="group" aria-label="カテゴリで絞り込む" data-filter></div>

  <!-- Feature -->
  <section class="wrap m-feature" aria-label="特集" data-feature></section>

  <!-- Latest ＋ Ranking -->
  <section class="m-latest">
    <div class="wrap m-latest__inner">
      <div class="m-latest__main">
        <div class="headline headline--stack">
          <h2 class="headline__en">LATEST</h2>
          <p class="headline__ja">新着の記事</p>
        </div>
        <div class="m-latest__grid" data-latest></div>
        <p class="m-empty" data-empty hidden>このカテゴリの記事はまだありません。</p>
        <button class="btn btn--outline" type="button" data-more>もっと読み込む</button>
      </div>

      <aside class="m-ranking" aria-label="よく読まれている記事">
        <div class="headline headline--stack">
          <h2 class="headline__en">RANKING</h2>
          <p class="headline__ja">よく読まれている記事</p>
        </div>
        <ol data-ranking></ol>
      </aside>
    </div>
  </section>
</main>

<script>
NMT.ready(function (db, ui) {
  var esc = ui.esc, f = NMT.fmt;
  var PAGE = 6;
  var all = db.t.articles.filter(function (a) { return a.status === 'PUBLISHED'; })
    .sort(function (a, b) { return Date.parse(b.publishedAt) - Date.parse(a.publishedAt); });
  // カテゴリ（記事にあるものだけ。特集の記事の並びを先に）
  var cats = [];
  all.slice().sort(function (a, b) { return (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0); })
    .forEach(function (a) { if (cats.indexOf(a.category) < 0) cats.push(a.category); });
  var cat = ui.param('cat');
  if (cats.indexOf(cat) < 0) cat = null;

  document.querySelector('[data-filter]').innerHTML = [null].concat(cats).map(function (c) {
    var on = c === cat;
    return '<a class="chip' + (on ? ' is-active' : '') + '" href="' + ui.url('media', { cat: c }) + '"' + (on ? ' aria-current="page"' : '') + '>' + esc(c || 'すべて') + '</a>';
  }).join('');

  var list = all.filter(function (a) { return !cat || a.category === cat; });
  var href = function (a) { return ui.url('article', { slug: a.slug }); };
  var md = function (a) { return f.ymd(a.publishedAt).slice(5); };

  // 特集（isFeatured）: 1件目を大きく、続く2件を右に
  var feat = list.filter(function (a) { return a.isFeatured; }).slice(0, 3);
  var featEl = document.querySelector('[data-feature]');
  if (!feat.length) featEl.hidden = true;
  else {
    var m = feat[0];
    featEl.innerHTML = '<a class="m-feature__main" href="' + href(m) + '">' +
        '<img class="m-feature__img" src="' + esc(m.coverUrl) + '" alt="">' +
        '<div class="m-feature__meta"><span class="tag tag--coral">特集</span><span>' + esc(m.category) + ' · 読了 ' + m.readMinutes + '分 · ' + f.ymd(m.publishedAt) + '</span></div>' +
        '<h2 class="m-feature__title">' + esc(m.title) + '</h2>' +
        (m.lead ? '<p class="m-feature__desc">' + esc(m.lead) + '</p>' : '') +
      '</a>' +
      (feat.length > 1 ? '<div class="m-feature__side">' + feat.slice(1).map(function (a) {
        return '<a class="m-card" href="' + href(a) + '"><img class="m-card__img m-card__img--l" src="' + esc(a.coverUrl) + '" alt="">' +
          '<p class="m-card__meta">' + esc(a.category) + ' · 読了 ' + a.readMinutes + '分</p><h3 class="m-card__title m-card__title--l">' + esc(a.title) + '</h3></a>';
      }).join('') + '</div>' : '');
  }

  // 新着（特集に出したものを除く）
  var latest = list.filter(function (a) { return feat.indexOf(a) < 0; });
  var shown = 0;
  var grid = document.querySelector('[data-latest]'), more = document.querySelector('[data-more]');
  function renderMore() {
    var next = latest.slice(shown, shown + PAGE);
    grid.insertAdjacentHTML('beforeend', next.map(function (a) {
      return '<a class="m-card" href="' + href(a) + '"><img class="m-card__img" src="' + esc(a.coverUrl) + '" alt="">' +
        '<p class="m-card__meta">' + esc(a.category) + ' · ' + md(a) + ' · ' + a.readMinutes + '分</p><h3 class="m-card__title">' + esc(a.title) + '</h3></a>';
    }).join(''));
    shown += next.length;
    more.hidden = shown >= latest.length;
  }
  more.addEventListener('click', renderMore);
  renderMore();
  grid.hidden = !latest.length;
  document.querySelector('[data-empty]').hidden = latest.length > 0 || feat.length > 0;
  if (!latest.length && feat.length) { grid.hidden = true; }

  // よく読まれている記事（閲覧数のデータが無いので、特集→新しい順の上位5件で代用）
  var rank = all.slice().sort(function (a, b) { return (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0) || Date.parse(b.publishedAt) - Date.parse(a.publishedAt); }).slice(0, 5);
  document.querySelector('[data-ranking]').innerHTML = rank.map(function (a, i) {
    return '<li><a class="m-rank" href="' + href(a) + '"><span class="m-rank__no">' + (i + 1) + '</span><span class="m-rank__title">' + esc(a.title) + '</span></a></li>';
  }).join('');
});
</script>
</body>
</html>
