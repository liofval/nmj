<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>告知配信｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="org.css">
<link rel="stylesheet" href="manage.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body class="org-page">
<div data-header="org" data-active="events"></div>
<main id="main"><div class="wrap" id="root"></div></main>
<div data-footer></div>
<script>
NMT.ready(function (db, ui) {
  var f = NMT.fmt, L = NMT.LABEL, root = document.getElementById('root');
  var id = ui.param('id'), org = NMT.currentOrg();
  var PAGE = 'announce', EN = 'ANNOUNCE', JA = '告知配信', DENY = 'このイベントの主催者（owner）だけが告知を送れます。';

  // ---- 共通: 見出し・権限 ----
  function gateBox(title, body, actions) {
    root.innerHTML = '<div class="box mg-gate"><p class="mg-gate__title">' + ui.esc(title) + '</p><p class="t-small">' + ui.esc(body) + '</p><div class="cluster">' + (actions || '') + '</div></div>';
  }
  function pickEvent() {
    var mine = db.t.events.filter(function (e) { return db.canManageEvent(e.id) && e.status !== 'DRAFT'; }).sort(function (a, b) { return Date.parse(a.startAt) - Date.parse(b.startAt); });
    if (!mine.length) return gateBox('管理しているイベントがありません', 'あなたが owner の団体（または個人）のイベントがここに出ます。', '<a class="btn btn--black" href="' + ui.url('dashboard', { org: org && org.slug }) + '">ダッシュボードへ</a>');
    root.innerHTML = '<div class="mg-head"><div class="p-head"><div><p class="p-head__en">' + EN + '</p><h1 class="p-head__ja">' + ui.esc(JA) + '：イベントを選ぶ</h1></div></div></div>' +
      '<div class="box"><div class="stack" style="--stack-gap:0">' + mine.map(function (e) {
        return '<a class="an-item" href="' + ui.url(PAGE, { id: e.id }) + '"><span class="an-item__subject">' + ui.esc(e.title) + '</span><span class="an-item__meta">' + f.card(e.startAt) + ' · ' + ui.esc(db.organizerById(e.organizerId).displayName) + '</span></a>';
      }).join('') + '</div></div>';
  }
  function head(e, compact) {
    var o = db.organizerById(e.organizerId);
    var tabs = [['attendees', '参加者・受付'], ['checkin', 'QR で受付'], ['announce', '告知'], ['transfer', '移管']];
    return '<div class="mg-head">' +
      '<a class="p-back" href="' + ui.url('dashboard', { org: o.slug }) + '">← ダッシュボード</a>' +
      (compact ? '' : '<div class="p-head"><div><p class="p-head__en">' + EN + '</p><h1 class="p-head__ja">' + ui.esc(JA) + '</h1></div></div>') +
      '<div class="mg-event"><p class="mg-event__title">' + ui.esc(e.title) + '</p><p class="mg-event__meta">' + f.card(e.startAt) + ' · ' + ui.esc(e.venueName || 'オンライン') + ' · ' + ui.esc(o.displayName) + (e.status === 'CANCELLED' ? ' · 中止' : '') + '</p></div>' +
      '</div>' +
      '<nav class="tabs mg-tabs" aria-label="イベントの管理">' + tabs.map(function (t) {
        return '<a class="tabs__item' + (t[0] === PAGE ? ' is-active' : '') + '" href="' + ui.url(t[0], { id: e.id }) + '"' + (t[0] === PAGE ? ' aria-current="page"' : '') + '>' + t[1] + '</a>';
      }).join('') + '<a class="tabs__item" href="' + ui.url('event', { id: e.id }) + '">公開ページ</a></nav>';
  }
  if (!ui.requireLogin()) return;
  if (!id) return pickEvent();
  var e = db.eventById(id);
  if (!e) return gateBox('イベントがありません', 'URL が正しいか確かめてください。', '<a class="btn btn--black" href="' + ui.url(PAGE) + '">イベントを選ぶ</a>');
  if (!db.canManageEvent(id)) return gateBox('このページを見る権限がありません', DENY, '<a class="btn btn--outline" href="' + ui.url('event', { id: id }) + '">公開ページへ</a>');

  // ---- 告知配信 ----
  var AUD = L.AnnouncementAudience;
  function chosen() { return [].slice.call(root.querySelectorAll('input[name=aud]:checked')).map(function (x) { return x.value; }); }
  function count() { return db.announceAudience(id, chosen()).length; }
  function previewHtml(n) {
    return '<div class="stack" style="--stack-gap:12px">' +
      '<p class="t-small">送り先：' + ui.esc(chosen().map(function (a) { return AUD[a]; }).join('・') || '未選択') + '（' + n + ' 人）</p>' +
      '<p class="t-small t-muted">件名</p><p style="font-weight:700">' + ui.esc(org.displayName + '：' + document.getElementById('an-subject').value) + '</p>' +
      '<p class="t-small t-muted">本文</p><div class="an-preview">' + ui.esc(document.getElementById('an-body').value) + '</div>' +
      '<p class="t-small t-muted">サイト内のお知らせとメールの両方に届きます。メールの受け取りを止めている人にはサイト内のお知らせだけ届きます。</p></div>';
  }
  function err(msg) { var el = document.getElementById('an-err'); el.textContent = msg || ''; el.hidden = !msg; }
  function refresh() {
    var n = count();
    var btn = document.getElementById('an-send');
    btn.textContent = n + ' 人に送信'; btn.disabled = !n;
    var list = db.announcementsOf(id);
    document.getElementById('an-history').innerHTML = list.length ? list.map(function (a) {
      return '<div class="an-item"><p class="an-item__subject">' + ui.esc(a.subject) + '</p>' +
        '<p class="an-item__meta">' + f.md(a.sentAt) + '（' + f.wd(a.sentAt) + '）' + f.hm(a.sentAt) + ' · ' + ui.esc(a.audiences.map(function (x) { return AUD[x]; }).join('・')) + ' ' + a.recipientCount + ' 人</p>' +
        '<p class="an-item__body">' + ui.esc(a.body) + '</p></div>';
    }).join('') : '<p class="t-small t-muted">まだ送信していません</p>';
  }
  function validate() {
    if (!chosen().length) return '送り先を選んでください';
    if (!document.getElementById('an-subject').value.trim() || !document.getElementById('an-body').value.trim()) return '件名と本文を入れてください';
    return '';
  }

  root.innerHTML = head(e) +
    '<div class="split">' +
      '<form class="box stack" id="an-form" novalidate>' +
        '<p class="box__title" style="margin:0">参加者に告知</p>' +
        '<fieldset class="stack" style="border:0;padding:0;margin:0;--stack-gap:10px"><legend class="field__label" style="margin-bottom:10px">送り先 <span class="req">必須</span></legend>' +
          ['ATTENDEES', 'SAVED'].map(function (k) {
            return '<label class="check"><input type="checkbox" name="aud" value="' + k + '"' + (k === 'ATTENDEES' ? ' checked' : '') + '>' + ui.esc(AUD[k]) + '（' + db.announceAudience(id, [k]).length + ' 人）</label>';
          }).join('') + '</fieldset>' +
        '<label class="field"><span class="field__label">件名 <span class="req">必須</span></span><input class="input" id="an-subject" maxlength="100" placeholder="例：集合場所の変更について"></label>' +
        '<label class="field"><span class="field__label">本文 <span class="req">必須</span></span><textarea class="textarea" id="an-body" maxlength="2000" style="min-height:clamp(160px,24vh,240px)"></textarea>' +
          '<span class="field__help">メールには「' + ui.esc(org.displayName) + '：件名」で届き、配信停止のリンクが自動で付きます。</span></label>' +
        '<p class="field__error" id="an-err" hidden></p>' +
        '<div class="cluster"><button type="button" class="btn btn--outline btn--sm" id="an-preview">プレビュー</button><button type="submit" class="btn btn--black btn--sm" id="an-send"></button></div>' +
      '</form>' +
      '<div class="box"><p class="box__title">送信履歴</p><div class="an-history" id="an-history"></div></div>' +
    '</div>';
  refresh();

  root.addEventListener('change', function (ev) { if (ev.target.name === 'aud') { err(''); refresh(); } });
  document.getElementById('an-preview').addEventListener('click', function () {
    ui.modal({ title: 'プレビュー', html: previewHtml(count()), actions: [{ label: '閉じる', value: false, kind: 'outline' }] });
  });
  document.getElementById('an-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var msg = validate(); err(msg); if (msg) return;
    var n = count();
    ui.modal({ title: n + ' 人に送信しますか？', html: previewHtml(n) + '<p class="t-small" style="margin-top:12px">送信すると取り消せません。</p>',
      actions: [{ label: 'やめる', value: false, kind: 'outline' }, { label: n + ' 人に送信する', value: true, kind: 'black' }] }).then(function (yes) {
      if (!yes) return;
      try {
        var an = db.sendAnnouncement(id, { subject: document.getElementById('an-subject').value.trim(), body: document.getElementById('an-body').value.trim(), audiences: chosen() });
        document.getElementById('an-subject').value = ''; document.getElementById('an-body').value = '';
        ui.toast(an.recipientCount + ' 人に送信しました');
        refresh();
      } catch (e2) { err(e2.message); }
    });
  });
});
</script>
</body>
</html>
