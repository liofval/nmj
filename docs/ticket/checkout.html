<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お支払い（モック）｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="flow.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body>
<div data-header="v2" data-active="none"></div>
<main id="main" class="flow-main"><div class="wrap"><div class="narrow" id="pay"></div></div></main>
<div data-footer></div>
<script>
NMT.ready(function (db, ui) {
  if (!ui.requireLogin()) return;
  var f = NMT.fmt, esc = ui.esc;
  var box = document.getElementById('pay');
  var pid = ui.param('payment');
  var timer = null;

  function head(ja) { return '<div class="p-head"><div><p class="p-head__en">CHECKOUT</p><h1 class="p-head__ja">' + esc(ja) + '</h1></div></div>'; }
  function stop(title, html) { clearInterval(timer); box.innerHTML = head(title) + '<div class="empty">' + html + '</div>'; }

  var p = pid && db.paymentById(pid);
  if (!p) return stop('決済が見つかりません', '<a class="textlink" href="' + ui.url('mypage') + '">マイページへ</a>');
  if (p.userId !== db.currentUser().id) return stop('この決済は表示できません', '申し込んだ本人だけが開けます。<br><a class="textlink" href="' + ui.url('mypage') + '">マイページへ</a>');
  var e = db.eventById(p.eventId);
  var eventUrl = ui.url('event', { id: e.id });

  function breakdown(p) {
    return '<div class="box"><p class="t-h3">' + esc(e.title) + '</p><p class="t-small t-muted">' + esc(f.card(e.startAt)) + ' · ' + esc(e.venueName || 'オンライン') + '</p>' +
      '<table class="confirm-table" style="margin-top:12px">' + p.slotIds.map(function (sid) {
        var s = db.slotById(sid); return '<tr><th scope="row">' + esc(s ? s.name : sid) + ' × 1</th><td class="num-cell">' + esc(f.yen(s ? s.priceYen : 0)) + '</td></tr>';
      }).join('') + '<tr class="total"><th scope="row">合計</th><td class="num-cell">' + esc(f.yen(p.amountYen)) + '</td></tr></table></div>';
  }
  function left(p) {
    var ms = Math.max(0, Date.parse(p.holdExpiresAt) - db.now());
    var m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60;
    return m + ':' + ('0' + s).slice(-2);
  }

  function pending(p) {
    box.innerHTML = head('お支払い') +
      '<div class="mock-banner"><b>これはモック決済です。</b>実際の請求は発生しません。「支払う」と「失敗させる（デモ）」で結果を選べます。</div>' +
      '<div class="stack" style="margin-top:24px;--stack-gap:20px">' + breakdown(p) +
        '<div class="box box--gray hold"><div><p class="t-h3">席を確保しています</p><p class="t-small t-muted">' + esc(f.hm(p.holdExpiresAt)) + ' までに支払いが終わらないと、確保は自動で取り消されます</p></div>' +
          '<p class="hold__time" data-left aria-live="off">' + left(p) + '</p></div>' +
        '<p class="t-small t-muted">有料枠は支払い後にキャンセルしても返金されません。支払いが終わった時点ですべての枠が参加予定になります。</p>' +
      '</div>' +
      '<div class="flow-actions"><button class="btn btn--outline" type="button" data-act="cancel">やめる</button>' +
        '<span class="cluster"><button class="btn btn--outline" type="button" data-act="fail">失敗させる（デモ）</button>' +
        '<button class="btn btn--coral" type="button" data-act="pay">' + esc(f.yen(p.amountYen)) + ' を支払う<img class="icon" src="assets/icon-arrow-btn.svg" alt=""></button></span></div>';
    clearInterval(timer);
    timer = setInterval(function () {
      var now = db.paymentById(p.id); // 期限切れはここで EXPIRED になる
      if (!now || now.status !== 'PENDING') return route();
      var el = box.querySelector('[data-left]'); if (el) el.textContent = left(now);
    }, 1000);
  }
  function waiting() {
    clearInterval(timer);
    box.innerHTML = '<div class="result" role="status"><div class="spinner" aria-hidden="true"></div><h1 class="result__title">お支払いを確認しています</h1><p class="t-muted">この画面のままお待ちください。<br>確認が取れると自動で切り替わります。</p></div>';
  }
  function paid(p) {
    clearInterval(timer);
    var x = db.myTickets().filter(function (t) { return t.event.id === p.eventId && !t.ticket.revokedAt; })[0];
    var names = p.slotIds.map(function (sid) { var s = db.slotById(sid); return s ? s.name : ''; }).join(' ＋ ');
    box.innerHTML = '<div class="result" role="status">' +
      '<p class="result__mark result__mark--ok" aria-hidden="true">✓</p>' +
      '<h1 class="result__title">参加予定になりました</h1>' +
      '<p class="t-muted">' + esc(e.title) + ' · ' + esc(names) + '（' + esc(f.yen(p.amountYen)) + '）</p>' +
      '<p class="t-small t-muted">QR チケットをメールでも送りました。当日は受付で QR を見せてください。</p>' +
      '<div class="result__actions">' +
        (x ? '<a class="btn btn--black btn--block" href="' + ui.url('ticket', { id: x.ticket.id }) + '">QR チケットを表示<img class="icon" src="assets/icon-arrow-btn-white.svg" alt=""></a>' : '') +
        '<a class="btn btn--outline btn--block" href="' + ui.url('mypage') + '">マイページで確認</a>' +
      '</div></div>';
  }
  function failed(p, err) {
    clearInterval(timer);
    box.innerHTML = '<div class="result" role="alert">' +
      '<p class="result__mark result__mark--ng" aria-hidden="true">!</p>' +
      '<h1 class="result__title">支払いに失敗しました</h1>' +
      '<p class="t-muted">' + esc(p.failureReason || '') + '<br>申込はまだ完了していません。確保していた席は解放しました。</p>' +
      '<div class="notice" style="width:min(480px,100%);text-align:left"><div>やり直すと、入力した回答はそのまま引き継ぎます。空きがなくなった場合は申し込めません。</div></div>' +
      (err ? '<div class="notice notice--error" style="width:min(480px,100%);text-align:left"><div>' + esc(err) + '</div></div>' : '') +
      '<div class="result__actions">' +
        '<button class="btn btn--coral btn--block" type="button" data-act="retry">もう一度支払う<img class="icon" src="assets/icon-arrow-btn.svg" alt=""></button>' +
        '<a class="btn btn--outline btn--block" href="' + eventUrl + '">イベントページへ</a>' +
      '</div></div>';
  }
  function expired(p) {
    clearInterval(timer);
    var cancelled = p.status === 'EXPIRED' && Date.parse(p.holdExpiresAt) > db.now();
    box.innerHTML = '<div class="result" role="alert">' +
      '<p class="result__mark" aria-hidden="true">—</p>' +
      '<h1 class="result__title">' + (cancelled ? '支払いを取りやめました' : '支払いの期限が切れました') + '</h1>' +
      '<p class="t-muted">' + (cancelled ? '申込はされていません。' : '確保していた席は解放しました。申込はされていません。') + '<br>もう一度申し込む場合は、イベントページからやり直してください。</p>' +
      '<div class="result__actions"><a class="btn btn--black btn--block" href="' + eventUrl + '">イベントページへ<img class="icon" src="assets/icon-arrow-btn-white.svg" alt=""></a></div></div>';
  }

  function route(err) {
    var cur = db.paymentById(pid);
    document.title = (cur.status === 'PAID' ? '参加予定になりました' : 'お支払い（モック）') + '｜NEXT MOVE TICKETS';
    if (cur.status === 'PENDING') pending(cur);
    else if (cur.status === 'PAID') paid(cur);
    else if (cur.status === 'FAILED') failed(cur, err);
    else if (cur.status === 'REFUNDED') stop('返金済みの決済です', 'このイベントは中止になり、返金しました。<br><a class="textlink" href="' + eventUrl + '">イベントページへ</a>');
    else expired(cur);
  }

  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'pay' || act === 'fail') {
      waiting();
      setTimeout(function () {
        try { db.completePayment(pid, act === 'pay', act === 'fail' ? 'カードが承認されませんでした（デモ）' : undefined); route(); }
        catch (err) { route(); ui.toast(err.message); }
      }, 1500);
    } else if (act === 'cancel') {
      ui.confirm({ title: '支払いをやめますか？', body: '確保している席を解放します。申込はされません。', ok: 'やめる', cancel: '支払いに戻る', danger: true }).then(function (yes) {
        if (!yes) return;
        db.cancelPayment(pid); location.href = eventUrl;
      });
    } else if (act === 'retry') {
      try {
        var r = db.retryPayment(pid);
        if (r.kind === 'payment') location.href = ui.url('checkout', { payment: r.paymentId });
        else location.href = ui.url('ticket', { id: r.ticketId });
      } catch (err) { failed(db.paymentById(pid), err.message); }
    }
  });

  route();
});
</script>
</body>
</html>
