<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベント（カード表示）｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="events.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body>

<div data-header="default"></div>

<main>
  <!-- PageHead -->
  <div class="wrap page-head">
    <div class="page-head__titles">
      <h1 class="page-head__en">EVENTS</h1>
      <div class="page-head__sub">
        <p class="page-head__ja">イベントをさがす</p>
        <p class="page-head__count" data-total></p>
      </div>
    </div>
    <nav class="view-toggle" aria-label="表示切替">
      <a class="view-toggle__item is-active" href="events.html" data-view="events" aria-current="page">カード</a>
      <a class="view-toggle__item" href="events-list.html" data-view="eventsList">リスト</a>
      <a class="view-toggle__item" href="calendar.html" data-view="calendar">カレンダー</a>
    </nav>
  </div>

  <!-- FilterBar -->
  <div class="wrap">
    <form class="searchbox filterbar" role="search" data-filter>
      <label class="searchbox__field searchbox__field--grow">
        <img class="icon" src="assets/icon-search.svg" alt="">
        <input class="searchbox__input" type="search" name="q" placeholder="キーワード" aria-label="キーワード" id="q">
      </label>
      <label class="searchbox__field">
        <span class="searchbox__label">日付</span>
        <select class="searchbox__value fsel" name="when" data-sel="when"></select>
        <img class="icon icon--14" src="assets/icon-chevron-down.svg" alt="">
      </label>
      <label class="searchbox__field">
        <span class="searchbox__label">エリア</span>
        <select class="searchbox__value fsel" name="area" data-sel="area"></select>
        <img class="icon icon--14" src="assets/icon-chevron-down.svg" alt="">
      </label>
      <label class="searchbox__field">
        <span class="searchbox__label">ジャンル</span>
        <select class="searchbox__value fsel" name="genre" data-sel="genre"></select>
        <img class="icon icon--14" src="assets/icon-chevron-down.svg" alt="">
      </label>
      <label class="searchbox__field">
        <span class="searchbox__label">価格</span>
        <select class="searchbox__value fsel" name="free" data-sel="free"></select>
        <img class="icon icon--14" src="assets/icon-chevron-down.svg" alt="">
      </label>
    </form>
  </div>

  <!-- ChipRow -->
  <div class="wrap filter-row">
    <div class="chip-row" role="group" aria-label="よく使う条件">
      <button class="chip" type="button" aria-pressed="false" data-chip="when:today">今日</button>
      <button class="chip" type="button" aria-pressed="false" data-chip="when:weekend">今週末</button>
      <button class="chip" type="button" aria-pressed="false" data-chip="free:1">無料</button>
      <button class="chip" type="button" aria-pressed="false" data-chip="kind:STUDENT">学生割あり</button>
      <button class="chip" type="button" aria-pressed="false" data-chip="area:online">オンライン</button>
      <button class="chip" type="button" aria-pressed="false" aria-disabled="true" disabled title="「初参加歓迎」はまだデータにありません">初参加歓迎</button>
      <button class="chip" type="button" aria-pressed="false" data-chip="avail:1">売り切れを除く</button>
    </div>
    <label class="sort">
      <span class="sort__label">並び順</span>
      <select class="sort__value fsel" name="sort" data-sel="sort">
        <option value="">開催日が近い順</option>
        <option value="new">新着順</option>
      </select>
      <img class="icon icon--14" src="assets/icon-chevron-down.svg" alt="">
    </label>
  </div>

  <!-- Results -->
  <section class="wrap events-results" aria-label="検索結果">
    <h2 class="result-head" data-result-head aria-live="polite"></h2>
    <div data-results></div>
  </section>

  <!-- More -->
  <div class="wrap more" data-more-wrap>
    <button class="btn btn--outline" type="button" data-more></button>
  </div>
</main>

<div data-footer></div>

<script>
// ヘッダー差し込み（DOMContentLoaded）の後に描く
document.addEventListener('DOMContentLoaded', function () {
NMT.ready(function (db, ui) {
  var VIEW = 'events'; // events（カード）／ eventsList（リスト）。この2ページは同じ処理で、描き方だけ違う
  var PAGE = 8;
  var f = NMT.fmt, DAY = 864e5, H9 = 9 * 3600e3;
  var KEYS = ['q', 'when', 'date', 'area', 'genre', 'kind', 'free', 'avail', 'sort'];
  var genres = db.t.genres.slice().sort(function (a, b) { return a.sortOrder - b.sortOrder; });
  var WHEN = { today: '今日', weekend: '今週末', month: '今月' };

  // ---- URL ⇔ 条件 ----
  function readState() {
    var p = new URLSearchParams(location.search), s = {};
    KEYS.forEach(function (k) { var v = (p.get(k) || '').trim(); if (v) s[k] = v; });
    if (s.when && !WHEN[s.when]) delete s.when;
    if (s.date && !/^\d{4}-\d{2}-\d{2}$/.test(s.date)) delete s.date;
    if (s.date) delete s.when;
    if (s.area && NMT.AREAS.indexOf(s.area) < 0) delete s.area;
    if (s.genre && !genres.some(function (g) { return g.slug === s.genre; })) delete s.genre;
    if (s.kind && !NMT.LABEL.SlotKind[s.kind]) delete s.kind;
    if (s.free !== '1') delete s.free;
    if (s.avail !== '1') delete s.avail;
    if (s.sort !== 'new') delete s.sort;
    return s;
  }
  var state = readState(), shown = PAGE;
  function writeUrl() { history.replaceState(null, '', ui.url(VIEW, state)); }

  // ---- 日付の範囲（JST の暦） ----
  function ymdOf(ms) { return new Date(ms + H9).toISOString().slice(0, 10); }
  function dayStart(ymd) { return Date.parse(ymd + 'T00:00:00+09:00'); }
  function iso(ms) { return new Date(ms).toISOString(); }
  function range(when, date) {
    var today = ymdOf(db.now()), a;
    if (date) { a = dayStart(date); return { from: iso(a), to: iso(a + DAY - 1), all: true }; }
    if (when === 'today') { a = dayStart(today); return { from: iso(a), to: iso(a + DAY - 1) }; }
    if (when === 'weekend') return db.weekendRange();
    if (when === 'month') return { from: iso(dayStart(today)), to: iso(Date.UTC(+today.slice(0, 4), +today.slice(5, 7), 1) - H9 - 1) };
    return {};
  }
  function areaLabel(a) { return a === 'online' ? 'オンライン' : a; }
  // 「今週末（10/31–11/1）」「11/1（日）」
  function whenLabel(when, date, short) {
    if (date) return f.md(dayStart(date)) + '（' + f.wd(dayStart(date)) + '）';
    if (!when) return '';
    if (short) return WHEN[when];
    var r = range(when);
    return WHEN[when] + '（' + f.md(r.from) + (f.md(r.from) === f.md(r.to) ? '' : '–' + f.md(r.to)) + '）';
  }

  function search() {
    var r = range(state.when, state.date);
    var list = db.searchEvents({ q: state.q, genre: state.genre, area: state.area, kind: state.kind, free: state.free === '1',
      from: r.from, to: r.to, status: r.all ? 'all' : 'upcoming', sort: state.sort });
    if (state.avail) list = list.filter(function (e) { return db.eventBadge(e.id).kind !== 'soldout'; });
    return list;
  }

  // ---- 絞り込みバー ----
  var form = document.querySelector('[data-filter]');
  var sel = {};
  Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (el) { sel[el.getAttribute('data-sel')] = el; });
  function opts(list) { return list.map(function (o) { return '<option value="' + ui.esc(o[0]) + '">' + ui.esc(o[1]) + '</option>'; }).join(''); }
  function fillSelects() {
    var whenOpts = [['', '指定なし']].concat(Object.keys(WHEN).map(function (k) { return [k, whenLabel(k)]; }));
    if (state.date) whenOpts.push(['date', whenLabel('', state.date)]);
    sel.when.innerHTML = opts(whenOpts);
    sel.area.innerHTML = opts([['', 'すべて']].concat(NMT.AREAS.map(function (a) { return [a, areaLabel(a)]; })));
    sel.genre.innerHTML = opts([['', 'すべて']].concat(genres.map(function (g) { return [g.slug, g.name]; })));
    sel.free.innerHTML = opts([['', '指定なし'], ['1', '無料']]);
  }
  fillSelects();
  function syncControls() {
    form.q.value = state.q || '';
    sel.when.value = state.date ? 'date' : (state.when || '');
    sel.area.value = state.area || '';
    sel.genre.value = state.genre || '';
    sel.free.value = state.free || '';
    sel.sort.value = state.sort || '';
    Array.prototype.forEach.call(document.querySelectorAll('[data-chip]'), function (b) {
      var kv = b.getAttribute('data-chip').split(':'), on = state[kv[0]] === kv[1];
      b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', String(on));
    });
  }
  function set(k, v) {
    if (v) state[k] = v; else delete state[k];
    if (k === 'when') delete state.date;
    shown = PAGE; writeUrl(); render();
  }
  sel.when.addEventListener('change', function () { if (sel.when.value !== 'date') set('when', sel.when.value); });
  ['area', 'genre', 'free', 'sort'].forEach(function (k) { sel[k].addEventListener('change', function () { set(k, sel[k].value); }); });
  var timer;
  form.q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { set('q', form.q.value.trim()); }, 250); });
  form.addEventListener('submit', function (ev) { ev.preventDefault(); clearTimeout(timer); set('q', form.q.value.trim()); });
  document.querySelector('.chip-row').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-chip]'); if (!b) return;
    var kv = b.getAttribute('data-chip').split(':');
    set(kv[0], state[kv[0]] === kv[1] ? '' : kv[1]);
  });
  document.querySelector('[data-more]').addEventListener('click', function () { shown += PAGE; render(); });

  // ---- 表示切替（カード／リスト／カレンダー）に条件を引き継ぐ ----
  function calParams() {
    var p = { q: state.q, area: state.area, genre: state.genre, kind: state.kind, free: state.free, avail: state.avail };
    var d = state.date || (state.when === 'today' ? ymdOf(db.now()) : state.when === 'weekend' ? ymdOf(Date.parse(db.weekendRange().from)) : '');
    if (d) { p.ym = d.slice(0, 7); p.day = d; }
    return p;
  }
  function syncToggle() {
    document.querySelector('[data-view=events]').href = ui.url('events', state);
    document.querySelector('[data-view=eventsList]').href = ui.url('eventsList', state);
    document.querySelector('[data-view=calendar]').href = ui.url('calendar', calParams());
  }

  // ---- 結果 ----
  function headText(n) {
    var parts = [whenLabel(state.when, state.date, true), state.area ? areaLabel(state.area) : '', state.genre ? (db.t.genres.filter(function (g) { return g.slug === state.genre; })[0] || {}).name : '',
      state.kind ? NMT.LABEL.SlotKind[state.kind] + 'の枠あり' : '', state.free ? '無料' : ''].filter(Boolean);
    var t = (state.q ? '「' + state.q + '」' + (parts.length ? '・' : 'の') : '') + (parts.length ? parts.join('・') + 'の' : state.q ? '' : '開催予定の') + 'イベント ' + n + '件';
    return t + (state.avail ? '（売り切れを除く）' : '');
  }
  function card(e) {
    var html = ui.eventCard(e);
    return db.eventBadge(e.id).kind === 'soldout' ? html.replace('class="event-card"', 'class="event-card is-soldout"') : html;
  }
  function row(e) {
    var o = db.organizerById(e.organizerId), g = db.genreById(e.genreId), price = f.priceLabel(db.priceRange(e.id));
    return '<a class="event-row" href="' + ui.url('event', { id: e.id }) + '">' +
      '<div class="event-row__date"><span class="event-row__day">' + f.ymd(e.startAt).slice(5) + '</span><span class="event-row__time">' + f.wd(e.startAt) + ' ' + f.hm(e.startAt) + '</span></div>' +
      '<img class="event-row__thumb" src="' + ui.esc(e.coverUrl) + '" alt="" loading="lazy">' +
      '<div class="event-row__body">' +
        '<p class="event-row__genre">' + ui.esc(g ? g.name : '') + '</p>' +
        '<h3 class="event-row__title">' + ui.esc(e.title) + '</h3>' +
        '<p class="event-row__meta">' + ui.esc(e.venueName || 'オンライン') + '｜' + ui.esc(o ? o.displayName : '') + '</p>' +
      '</div>' +
      '<span class="event-row__price"><span class="price' + (price === '無料' ? ' price--free' : '') + '">' + price + '</span></span>' +
      ui.pill(db.eventBadge(e.id)) +
      '<span class="event-row__arrow"><img class="icon" src="assets/icon-arrow-up-right.svg" alt=""></span></a>';
  }
  function listHtml(list, all) {
    var html = '', cur = '';
    list.forEach(function (e) {
      var d = ymdOf(Date.parse(e.startAt));
      if (d !== cur) {
        cur = d;
        var n = all.filter(function (x) { return ymdOf(Date.parse(x.startAt)) === d; }).length;
        html += '<div class="day-head"><h3 class="day-head__date">' + f.md(e.startAt) + '（' + f.wd(e.startAt) + '）</h3><span class="day-head__count">' + n + '件</span></div>';
      }
      html += row(e);
    });
    return html;
  }

  function render() {
    syncControls(); syncToggle();
    var all = search(), list = all.slice(0, shown);
    document.querySelector('[data-total]').textContent = '全' + db.searchEvents({}).length + '件';
    document.querySelector('[data-result-head]').textContent = headText(all.length);
    var box = document.querySelector('[data-results]');
    if (!all.length) {
      box.innerHTML = '<div class="empty events-empty"><p>条件に合うイベントはありません。</p><p>キーワードを短くするか、条件を外してみてください。</p>' +
        '<a class="btn btn--outline" href="' + ui.url(VIEW) + '">条件をすべて外す</a></div>';
    } else {
      box.innerHTML = VIEW === 'events' ? '<div class="event-grid">' + list.map(card).join('') + '</div>' : listHtml(list, all);
    }
    var rest = all.length - list.length;
    document.querySelector('[data-more-wrap]').hidden = rest <= 0;
    document.querySelector('[data-more]').textContent = 'もっと見る（残り' + rest + '件）';
  }
  render();
  if (location.hash === '#q') form.q.focus();
});
});
</script>
</body>
</html>
