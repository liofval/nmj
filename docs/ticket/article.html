<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>記事｜NEXT MOVE TICKETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="media.css">
<script src="data.js"></script>
<script src="common.js"></script>
</head>
<body>

<div data-header="v2" data-active="media"></div>

<main class="ar-layout" data-main>
  <article class="ar-body">
    <a class="ar-back" href="media.html">← メディアに戻る</a>
  </article>
  <aside class="ar-side" data-side></aside>
</main>

<script>
NMT.ready(function (db, ui) {
  var esc = ui.esc, f = NMT.fmt;
  var body = document.querySelector('.ar-body'), side = document.querySelector('[data-side]');
  var a = db.articleBySlug(ui.param('slug') || 'keio-lightmusic-interview');
  if (!a || a.status !== 'PUBLISHED') {
    body.insertAdjacentHTML('beforeend', '<p class="empty">この記事は見つかりませんでした。</p>');
    side.hidden = true;
    return;
  }
  document.title = a.title + '｜NEXT MOVE TICKETS';
  var author = a.authorUserId ? db.profileOf(a.authorUserId) : null;
  var org = a.authorOrganizerId ? db.organizerById(a.authorOrganizerId) : null;

  // 本文: 空行で段落。「## 」で始まる段落は見出し（目次に載る）、「> 」は引用
  var secs = [];
  var html = String(a.body || '').split(/\n{2,}/).map(function (para) {
    para = para.trim(); if (!para) return '';
    if (/^## /.test(para)) { secs.push(para.slice(3)); return '<h2 class="ar-h2" id="sec-' + secs.length + '">' + esc(para.slice(3)) + '</h2>'; }
    if (/^> /.test(para)) {
      var lines = para.split('\n').map(function (l) { return l.replace(/^> ?/, ''); });
      var cite = lines.length > 1 && /^— /.test(lines[lines.length - 1]) ? lines.pop() : '';
      return '<blockquote class="ar-quote"><p class="ar-quote__text">' + esc(lines.join(' ')) + '</p>' + (cite ? '<cite class="ar-quote__cite">' + esc(cite) + '</cite>' : '') + '</blockquote>';
    }
    return '<p class="ar-p">' + esc(para).replace(/\n/g, '<br>') + '</p>';
  }).join('');

  // 関連イベント（eventIds。下書きは出さない）
  var events = (a.eventIds || []).map(db.eventById).filter(function (e) { return e && e.status !== 'DRAFT'; });
  var embeds = events.map(function (e) {
    return '<div class="ar-embed">' +
      '<img class="ar-embed__img" src="' + esc(e.coverUrl) + '" alt="">' +
      '<div class="ar-embed__body">' +
        '<p class="ar-embed__label">この記事に関連するイベント</p>' +
        '<p class="ar-embed__title">' + esc(e.title) + '</p>' +
        '<p class="ar-embed__info">' + f.card(e.startAt) + ' · ' + esc(e.venueName || 'オンライン') + ' · ' + f.priceLabel(db.priceRange(e.id)) + '</p>' +
        ui.pill(db.eventBadge(e.id)) +
      '</div>' +
      '<a class="btn btn--black" href="' + ui.url('event', { id: e.id }) + '">チケットを見る<img class="icon" src="assets/icon-arrow-btn-white.svg" alt=""></a>' +
    '</div>';
  }).join('');

  var orgHtml = '';
  if (org) {
    var orgUrl = ui.url('organizer', { slug: org.slug });
    orgHtml = '<div class="ar-org">' +
      '<a class="ar-org__mark" href="' + orgUrl + '" aria-label="' + esc(org.displayName) + 'のページ"></a>' +
      '<div class="ar-org__text">' +
        '<p class="ar-org__label">記事に登場する主催者</p>' +
        '<a class="ar-org__name" href="' + orgUrl + '">' + esc(org.displayName) + '</a>' +
        '<p class="ar-org__handle">@' + esc(org.slug) + (org.type === 'GROUP' ? ' · フォロワー <span data-follower-count>' + db.followerCount(org.id) + '</span>' : '') + '</p>' +
      '</div>' +
      (org.type === 'GROUP' ? '<button class="btn btn--outline" type="button" data-follow aria-pressed="false"></button>' : '') +
    '</div>';
  }

  body.insertAdjacentHTML('beforeend',
    '<div class="ar-meta"><span class="tag tag--lavender">' + esc(a.category) + '</span><span>読了 ' + a.readMinutes + '分 · ' + f.ymd(a.publishedAt) + '</span></div>' +
    '<h1 class="ar-title">' + esc(a.title) + '</h1>' +
    '<div class="ar-byline"><span class="dot bg-mint ar-byline__avatar"></span><div class="ar-byline__text">' +
      '<p class="ar-byline__name">文：' + esc(author ? author.displayName : 'NMJ 編集部') + '</p>' +
      (org ? '<p class="ar-byline__credit">取材協力：' + esc(org.displayName) + '</p>' : '') +
    '</div></div>' +
    '<img class="ar-hero" src="' + esc(a.coverUrl) + '" alt="">' +
    (a.lead ? '<p class="ar-lead">' + esc(a.lead) + '</p>' : '') +
    html + embeds + orgHtml +
    '<div class="ar-share"><button class="chip-sm" type="button" data-copy>リンクをコピー</button></div>');

  // 右: 目次（見出しがあるときだけ）と関連記事（同じカテゴリ → 新しい順）
  var others = db.t.articles.filter(function (x) { return x.status === 'PUBLISHED' && x.id !== a.id; })
    .sort(function (x, y) { return (y.category === a.category ? 1 : 0) - (x.category === a.category ? 1 : 0) || Date.parse(y.publishedAt) - Date.parse(x.publishedAt); }).slice(0, 3);
  side.innerHTML =
    (secs.length ? '<nav class="ar-toc" aria-label="目次"><p class="ar-side__title">目次</p>' + secs.map(function (t, i) {
      return '<a class="ar-toc__item" href="#sec-' + (i + 1) + '"><span class="ar-toc__no">' + ('0' + (i + 1)).slice(-2) + '</span><span class="ar-toc__text">' + esc(t) + '</span></a>';
    }).join('') + '</nav>' : '') +
    '<div class="ar-related"><p class="ar-side__title">関連記事</p>' + others.map(function (x) {
      return '<a class="ar-rel" href="' + ui.url('article', { slug: x.slug }) + '"><img class="ar-rel__img" src="' + esc(x.coverUrl) + '" alt=""><span class="ar-rel__title">' + esc(x.title) + '</span></a>';
    }).join('') + '</div>';

  // フォロー
  var follow = body.querySelector('[data-follow]');
  function paint() {
    var on = db.isFollowing(org.id);
    follow.setAttribute('aria-pressed', on ? 'true' : 'false');
    follow.textContent = on ? 'フォロー中' : '＋ フォロー';
    var c = body.querySelector('[data-follower-count]'); if (c) c.textContent = db.followerCount(org.id);
  }
  if (follow) {
    paint();
    follow.addEventListener('click', function () {
      if (!db.currentUser()) { location.href = ui.url('login', { next: ui.url('article', { slug: a.slug }) }); return; }
      try { db.toggleFollow(org.id); paint(); } catch (x) { ui.toast(x.message); }
    });
  }
  body.querySelector('[data-copy]').addEventListener('click', function () { ui.copyLink(); });

  // 目次の現在地（スクロールに合わせて太字）
  var links = side.querySelectorAll('.ar-toc__item');
  function spy() {
    var current = links[0];
    links.forEach(function (l) { var sec = document.querySelector(l.getAttribute('href')); if (sec && sec.getBoundingClientRect().top < window.innerHeight * 0.4) current = l; });
    links.forEach(function (l) { l.classList.toggle('is-current', l === current); });
  }
  if (links.length) { window.addEventListener('scroll', spy, { passive: true }); spy(); }
});
</script>
</body>
</html>
